name: Data Sync

# Runs the full card/set/gallery/banlist sync daily and publishes any
# changes straight to main via the data channel (data-channel.json tag:
# "main") — no vX.Y.Z tag, so this never triggers the binary-release
# workflow. Clients pick up new data through the existing background/manual
# "check for card-data update" mechanism, no app update required.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # raw-cards.json + sync-state.json drive the *incremental* sync but are
      # gitignored, so a fresh checkout has neither — without this, every run
      # sees an empty DB and does a full ~3k-card fetch from Yugipedia (slow,
      # risks the 45-min timeout, hammers the wiki). Restore them from the
      # previous run's cache so the sync only fetches new/changed cards. The
      # sync-progress* files let a timed-out run resume mid-fetch next time.
      # Rolling-key pattern: the exact key is unique per run (so we always save
      # a fresh copy), and restore-keys falls back to the most recent prior save.
      - name: Restore incremental sync state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw-cards.json
            data/sync-state.json
            data/sync-progress*.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      - name: Sync cards, sets, gallery, banlist + refresh data-version/data-channel
        run: npm run sync-data

      # Persist the updated raw DB + state for the next run. always() so a
      # timed-out/failed sync still saves partial progress (raw-cards.json is
      # written atomically every 50 cards) for the resume path to pick up.
      - name: Save incremental sync state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw-cards.json
            data/sync-state.json
            data/sync-progress*.json
          key: sync-state-${{ github.run_id }}

      - name: Commit and push if anything changed
        id: publish
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes — nothing to publish."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          {
            echo "chore(data): automated sync $(date -u +%Y-%m-%d)"
            echo
            git diff --cached --stat data/
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr caches the @main ref for a while (their docs say up to ~12h);
      # clients poll data-channel.json via that ref to detect new data, so a
      # stale CDN copy means the "check for card-data update" mechanism can't
      # see this sync happened until the cache naturally expires. Force it.
      - name: Purge jsDelivr cache for the data channel + files
        if: steps.publish.outputs.pushed == 'true'
        run: |
          for f in data-channel.json cards.json sets-data.json gallery-images.json image-urls.json banlist.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/shaser0/rush-duel-app@main/data/$f" || true
          done
