name: Data Sync

# Runs the full card/set/gallery/banlist sync daily and publishes any changes
# to main, then tags the data commit with an immutable "data-v<N>" tag and
# points data-channel.json at it. Clients read the tiny data-channel.json
# pointer from @main but download the data itself from the pinned @data-v<N>
# tag, so jsDelivr always serves a *consistent* snapshot — it can't hand out
# data-channel.json and data-version.json at mismatched versions (mutable-@main
# per-file cache skew), which previously drove clients into a reload loop.
# "data-v<N>" does not match the release workflow's "v[0-9]*" trigger, so this
# never rebuilds binaries. Clients pick new data up through the existing
# background/manual "check for card-data update" mechanism — no app update.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # raw-cards.json + sync-state.json drive the *incremental* sync but are
      # gitignored, so a fresh checkout has neither — without this, every run
      # sees an empty DB and does a full ~3k-card fetch from Yugipedia (slow,
      # risks the 45-min timeout, hammers the wiki). Restore them from the
      # previous run's cache so the sync only fetches new/changed cards.
      #
      # IMPORTANT: this path list must stay byte-identical to the Save step's
      # (and to any manual re-seed). actions/cache derives the cache *version*
      # from the paths, and a restore-keys prefix only matches caches of the
      # same version — a mismatch here silently falls back to a full fetch.
      #
      # Rolling-key pattern: the exact key is unique per run (so we always save
      # a fresh copy), and restore-keys falls back to the most recent prior save.
      - name: Restore incremental sync state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw-cards.json
            data/sync-state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      - name: Sync cards, sets, gallery, banlist + refresh data-version/data-channel
        run: npm run sync-data

      # Persist the updated raw DB + state for the next run. always() so a
      # failed sync still saves the partial raw-cards.json (written atomically
      # every 50 cards), leaving less to re-fetch next run. Path list MUST match
      # the Restore step above (see the cache-version note there).
      - name: Save incremental sync state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw-cards.json
            data/sync-state.json
          key: sync-state-${{ github.run_id }}

      - name: Commit and push if anything changed
        id: publish
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes — nothing to publish."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          {
            echo "chore(data): automated sync $(date -u +%Y-%m-%d)"
            echo
            git diff --cached --stat data/
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Tag the just-pushed data commit with the immutable tag hash-data wrote
      # into data-channel.json (data-v<N>). Clients download the data from this
      # pinned tag, so jsDelivr serves one consistent commit — no per-file skew.
      - name: Tag the data release
        id: tag
        if: steps.publish.outputs.pushed == 'true'
        run: |
          TAG="$(node -e "process.stdout.write(require('./data/data-channel.json').tag)")"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            echo "Refusing to tag: data-channel.json tag is '$TAG' (expected data-v<N>)." >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged data commit as $TAG"

      # The pinned @data-v<N> tag is brand new, so jsDelivr will fetch its files
      # fresh on first request. The one file clients read from the *mutable*
      # @main ref is data-channel.json — that must be purged so the new pointer
      # is visible before its ~12h cache expires. (Even if this purge is missed,
      # a stale pointer only names an older *consistent* tag, delaying the update
      # — it can no longer loop.) The @data-v<N> purges are belt-and-suspenders
      # in case a client raced a request before the tag existed.
      - name: Purge jsDelivr cache for the data channel + tagged data
        if: steps.publish.outputs.pushed == 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          curl -fsS "https://purge.jsdelivr.net/gh/shaser0/rush-duel-app@main/data/data-channel.json" || true
          for f in data-version.json cards.json sets-data.json gallery-images.json image-urls.json banlist.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/shaser0/rush-duel-app@${TAG}/data/$f" || true
          done
