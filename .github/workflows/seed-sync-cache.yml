name: Seed Sync Cache (temporary)

# One-off utility: primes the Actions cache that data-sync.yml reads, so the
# first scheduled sync skips the cold ~3k-card full fetch (which would blow the
# 45-min timeout) and goes straight to an incremental run. Downloads a known-good
# raw-cards.json + sync-state.json snapshot from a gist and saves them under a
# key matching data-sync's `sync-state-` restore-key prefix.
#
# SAFE TO DELETE once it has run successfully — see the accompanying gist too.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Download seed snapshot from gist
        env:
          GIST: https://gist.githubusercontent.com/shaser0/d3dabe2b7eee4a9e44282ec6d4e444ec/raw
        run: |
          mkdir -p data
          curl -fsSL "$GIST/raw-cards.json"  -o data/raw-cards.json
          curl -fsSL "$GIST/sync-state.json" -o data/sync-state.json
          echo "raw-cards.json bytes: $(wc -c < data/raw-cards.json)"
          node -e "const c=require('./data/raw-cards.json'); if(!Array.isArray(c)||c.length<3000) throw new Error('bad snapshot: '+ (Array.isArray(c)?c.length:'not array')); console.log('ok: '+c.length+' cards')"

      - name: Save to sync-state cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw-cards.json
            data/sync-state.json
          key: sync-state-seed
